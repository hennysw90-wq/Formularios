name: leer
on: push
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - run: |
          TOK=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=AIzaSyDgLm6b2mXz50ITTKmgkO7Ia0qloZXypJw" -H 'Content-Type: application/json' -d '{"returnSecureToken":true}' | python3 -c "import json,sys;print(json.load(sys.stdin).get('idToken',''))")
          B="https://firestore.googleapis.com/v1/projects/cdr-reuniones/databases/(default)/documents"
          for c in formularios evaluaciones compromisos; do
            tok=""; i=0; echo '[]' > $c.json
            while : ; do
              curl -s -H "Authorization: Bearer $TOK" "$B/$c?pageSize=300${tok:+&pageToken=$tok}" > p.json
              python3 -c "
          import json;a=json.load(open('$c.json'));p=json.load(open('p.json'));a+=p.get('documents',[]);json.dump(a,open('$c.json','w'));print(p.get('nextPageToken',''))" > t.txt
              tok=$(cat t.txt); i=$((i+1)); [ -z "$tok" ] && break; [ $i -gt 30 ] && break
            done
          done
          cat > r.py <<'PY'
          import json, collections
          def val(v):
              if 'mapValue' in v: return {k:val(x) for k,x in v['mapValue'].get('fields',{}).items()}
              if 'arrayValue' in v: return [val(x) for x in v['arrayValue'].get('values',[])]
              if 'integerValue' in v: return int(v['integerValue'])
              if 'doubleValue' in v: return v['doubleValue']
              return list(v.values())[0] if v else None
          def docs(c): return [dict(id=d['name'].split('/')[-1], **{k:val(x) for k,x in d.get('fields',{}).items()}) for d in json.load(open(c+'.json'))]
          F=docs('formularios'); E=docs('evaluaciones')
          F2=[f for f in F if f['id']=='f_mwm6ti6tjnd7'][0]
          um=(F2.get('parametros') or {})
          def calc(form, resp):
              sp_b=0; acc=0; crit=[]; bl=[]
              for b in form['bloques']:
                  sp=0; ac=0
                  for c in b['criterios']:
                      r=(resp.get(c['codigo']) or {}).get('nivel')
                      if r is None or r=='' or r=='NA': continue
                      sp+=c['peso']; ac+=c['peso']*(float(r)/2)
                      if c.get('critico') and float(r)==0: crit.append(c['codigo'])
                  pj=ac/sp*100 if sp else None
                  bl.append((b['nombre'], None if pj is None else round(pj,1)))
                  if pj is not None: sp_b+=b['peso']; acc+=b['peso']*pj/100
              ind=round(acc/sp_b*1000)/10 if sp_b else 0
              ue=um.get('umbralEfectiva',85); ud=um.get('umbralDesarrollo',70)
              cl='efectiva' if ind>=ue and not crit else 'desarrollo' if ind>=ud else 'intervencion'
              return ind, cl, crit
          for e in E:
              if 'ixivi' in (e.get('rutinaNombre') or '') and e.get('estado')=='enviada':
                  r=e.get('resultado') or {}
                  n=calc(F2, e.get('respuestas') or {})
                  print('EV', e['id'], (e.get('fechaEnvio') or '')[:10], e.get('evaluadorNombre'), '| lider', e.get('lider'), '| antes', r.get('indice'), r.get('clasificacion'), r.get('criticosEnCero'), '| C5/C6', (e.get('respuestas') or {}).get('C5',{}).get('nivel'), (e.get('respuestas') or {}).get('C6',{}).get('nivel'), '| F2 ->', n)
          C=docs('compromisos') if False else []
          PY
          python3 r.py
          python3 -c "
          import json
          D=json.load(open('compromisos.json'))
          ids=[d['name'].split('/')[-1] for d in D]
          print('CIERRES', len(ids))
          open('ids.txt','w').write(' '.join(ids))"
          cat ids.txt
