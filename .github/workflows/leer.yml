name: leer
on: push
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1400, height: 1000 } });
            p.on("console", (m) => console.log("CONSOLE", m.type(), m.text().slice(0, 300)));
            p.on("pageerror", (e) => console.log("PAGEERR", e.message));
            await p.goto("https://calendario-turnos-oems.web.app/"); await p.waitForTimeout(12000);
            console.log("LEYENDA", await p.locator("text=Formularios programados").count(), "BLOQUES", await p.locator("text=Reunión Especial Lixiviación").count());
            await p.screenshot({ path: "cal.png" });
            await b.close();
          })();
          JS
          node t.js
      - uses: actions/upload-artifact@v4
        with: { name: cal, path: cal.png }
